# Enable RGB Underglow / WS2812 LED Support
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y

# Automatically turn on LEDs when powering on (no keypress needed)
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y

# Start with Swirl effect (3): with 2 LEDs, LED 1 is Red (0 deg) and LED 2 is Blue (180 deg)
# and they continuously animate/blink across colors
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3

# Start at 100% brightness and full saturation
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=100
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=100

# Start Hue at 0 (Red)
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=0

# Animation speed (1 to 5)
CONFIG_ZMK_RGB_UNDERGLOW_SPD_START=3

# Prevent LEDs from turning off automatically while testing
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=n
