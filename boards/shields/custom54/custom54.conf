# Enable RGB Underglow / WS2812 LED Support
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y

# Automatically turn on LEDs when powering on (no keypress needed)
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y

# Start with Swirl effect (3): with 2 LEDs, LED 1 is Red (0 deg) and LED 2 is Blue (180 deg)
# and they continuously animate/blink across colors
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3

# Start at 50% brightness (safe current draw for 27 LEDs) and full saturation
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=50
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=100
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=100

# Start Hue at 0 (Red)
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=0

# Animation speed (1 to 5)
CONFIG_ZMK_RGB_UNDERGLOW_SPD_START=3

# Turn off LEDs when idle to save battery
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=n

# Deep Sleep & Power Management
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Enable OLED Display (128x64 0.96")
CONFIG_ZMK_DISPLAY=y
CONFIG_SSD1306=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y
CONFIG_ZMK_WIDGET_LAYER_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y
CONFIG_ZMK_WIDGET_WPM_STATUS=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096
CONFIG_LV_Z_VDB_SIZE=64

# Enable ZMK Studio Support
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n


